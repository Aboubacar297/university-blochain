# Réseau Fabric du registre de diplômes : 3 orderers Raft, 3 peers (Org1/Org2/Org3), 3 CouchDB.
# Lancé par blockchain/scripts/network.sh (sinon : --env-file ../config/network.env).

x-orderer-env: &orderer-env
  FABRIC_LOGGING_SPEC: INFO
  ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
  ORDERER_GENERAL_LOCALMSPID: OrdererMSP
  ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
  ORDERER_GENERAL_TLS_ENABLED: "true"
  ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
  ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
  ORDERER_GENERAL_BOOTSTRAPMETHOD: none
  ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
  ORDERER_ADMIN_TLS_ENABLED: "true"
  ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
  ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"

x-orderer-base: &orderer-base
  image: hyperledger/fabric-orderer:${FABRIC_IMAGE_TAG:-2.5.16}
  command: orderer
  working_dir: /root
  restart: unless-stopped
  networks:
    - diploma_net

x-peer-env: &peer-env
  FABRIC_LOGGING_SPEC: INFO
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_PROFILE_ENABLED: "false"
  CORE_PEER_TLS_CERT_FILE: /var/hyperledger/peer/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /var/hyperledger/peer/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /var/hyperledger/peer/tls/ca.crt
  CORE_PEER_MSPCONFIGPATH: /var/hyperledger/peer/msp
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: diploma_net
  CORE_LEDGER_STATE_STATEDATABASE: CouchDB
  CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${COUCHDB_USER:-admin}
  CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD:-adminpw}

x-peer-base: &peer-base
  image: hyperledger/fabric-peer:${FABRIC_IMAGE_TAG:-2.5.16}
  command: peer node start
  working_dir: /root
  restart: unless-stopped
  networks:
    - diploma_net

x-couchdb-base: &couchdb-base
  image: couchdb:${COUCHDB_IMAGE_TAG:-3.3.3}
  restart: unless-stopped
  environment:
    COUCHDB_USER: ${COUCHDB_USER:-admin}
    COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-adminpw}
  networks:
    - diploma_net

services:
  # ===================== Service de commande : 3 orderers Raft =====================
  orderer1.example.com:
    <<: *orderer-base
    container_name: orderer1.example.com
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
    ports:
      - "7050:7050"
      - "7053:7053"
    volumes:
      - ../organizations/ordererOrganizations/example.com/orderers/orderer1.example.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer1.example.com/tls:/var/hyperledger/orderer/tls
      - orderer1.example.com:/var/hyperledger/production/orderer

  orderer2.example.com:
    <<: *orderer-base
    container_name: orderer2.example.com
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 8050
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:8053
    ports:
      - "8050:8050"
      - "8053:8053"
    volumes:
      - ../organizations/ordererOrganizations/example.com/orderers/orderer2.example.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer2.example.com/tls:/var/hyperledger/orderer/tls
      - orderer2.example.com:/var/hyperledger/production/orderer

  orderer3.example.com:
    <<: *orderer-base
    container_name: orderer3.example.com
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 9050
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9053
    ports:
      - "9050:9050"
      - "9053:9053"
    volumes:
      - ../organizations/ordererOrganizations/example.com/orderers/orderer3.example.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer3.example.com/tls:/var/hyperledger/orderer/tls
      - orderer3.example.com:/var/hyperledger/production/orderer

  # ===================== CouchDB (World State) =====================
  couchdb0:
    <<: *couchdb-base
    container_name: couchdb0
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - couchdb0:/opt/couchdb/data

  couchdb1:
    <<: *couchdb-base
    container_name: couchdb1
    ports:
      - "127.0.0.1:7984:5984"
    volumes:
      - couchdb1:/opt/couchdb/data

  couchdb2:
    <<: *couchdb-base
    container_name: couchdb2
    ports:
      - "127.0.0.1:9984:5984"
    volumes:
      - couchdb2:/opt/couchdb/data

  # ===================== Org1 : Université =====================
  peer0.org1.example.com:
    <<: *peer-base
    container_name: peer0.org1.example.com
    depends_on:
      - couchdb0
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.org1.example.com
      CORE_PEER_ADDRESS: peer0.org1.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.example.com:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb0:5984
    ports:
      - "7051:7051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/var/hyperledger/peer/msp
      - ../organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/var/hyperledger/peer/tls
      - peer0.org1.example.com:/var/hyperledger/production

  # ===================== Org2 : Ministère =====================
  peer0.org2.example.com:
    <<: *peer-base
    container_name: peer0.org2.example.com
    depends_on:
      - couchdb1
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.org2.example.com
      CORE_PEER_ADDRESS: peer0.org2.example.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.org2.example.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org2.example.com:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org2.example.com:9051
      CORE_PEER_LOCALMSPID: Org2MSP
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb1:5984
    ports:
      - "9051:9051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp:/var/hyperledger/peer/msp
      - ../organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls:/var/hyperledger/peer/tls
      - peer0.org2.example.com:/var/hyperledger/production

  # ===================== Org3 : Recruteurs (lecture) =====================
  peer0.org3.example.com:
    <<: *peer-base
    container_name: peer0.org3.example.com
    depends_on:
      - couchdb2
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.org3.example.com
      CORE_PEER_ADDRESS: peer0.org3.example.com:11051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:11051
      CORE_PEER_CHAINCODEADDRESS: peer0.org3.example.com:11052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:11052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org3.example.com:11051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org3.example.com:11051
      CORE_PEER_LOCALMSPID: Org3MSP
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb2:5984
    ports:
      - "11051:11051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org3.example.com/peers/peer0.org3.example.com/msp:/var/hyperledger/peer/msp
      - ../organizations/peerOrganizations/org3.example.com/peers/peer0.org3.example.com/tls:/var/hyperledger/peer/tls
      - peer0.org3.example.com:/var/hyperledger/production

networks:
  diploma_net:
    name: diploma_net

volumes:
  orderer1.example.com:
  orderer2.example.com:
  orderer3.example.com:
  couchdb0:
  couchdb1:
  couchdb2:
  peer0.org1.example.com:
  peer0.org2.example.com:
  peer0.org3.example.com:
