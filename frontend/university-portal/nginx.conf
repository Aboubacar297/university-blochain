# Redirection HTTP vers HTTPS (le certificat est géré par le reverse proxy ou par certbot).
server {
  listen 8080;
  server_name _;

  # Sonde de disponibilité : ne doit pas être redirigée
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;

  root /usr/share/nginx/html;
  index index.html;

  # --- En-têtes de sécurité ---
  # HSTS : 2 ans, sous-domaines inclus, éligible à la liste de préchargement des navigateurs
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # CSP : adaptez api.exemple.ma, auth.exemple.ma et plausible.io à votre installation.
  # 'unsafe-inline' sur style-src est nécessaire aux styles calculés par React (dégradés du graphique).
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://challenges.cloudflare.com https://plausible.io; frame-src https://challenges.cloudflare.com; connect-src 'self' https://api.exemple.ma https://auth.exemple.ma https://plausible.io; upgrade-insecure-requests" always;

  # Les fichiers versionnés par Vite peuvent être mis en cache durablement
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /sitemap.xml { expires 1d; }
  location = /robots.txt  { expires 1d; }

  # Application monopage : toutes les routes renvoient index.html
  location / {
    try_files $uri /index.html;
  }
}
